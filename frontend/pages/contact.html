<div class="hero-scene text-center text-white">
    <div class="text-center hero-scene-content">
        <h1>Contact</h1>
    </div>
</div>

<section class="container py-5">
  <div class="row align-items-center">
    <div class="col-md-6">
        <h1>Contactez-nous</h1>
        <p>Pour toute demande de renseignements, réservation ou question, n'hésitez pas à nous contacter. Nous sommes là pour vous aider et répondre à toutes vos questions.</p>
        <ul>
            <li>Email : <a href="mailto:contact@viteetgourmand.fr">contact@viteetgourmand.fr</a></li>
            <li>Téléphone : <a href="tel:+33123456789">+33 1 23 45 67 89</a></li>
        </ul>
    </div>
  </div>
</section>  

<section>
    <div class="container py-5">
        <h2>Formulaire de contact</h2>
        <form>
            <div class="form-group">
                <label for="name">Nom</label>
                <input type="text" class="form-control" id="name" placeholder="Votre nom">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Votre email">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea class="form-control" id="message" rows="5" placeholder="Votre message"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Envoyer</button>
        </form>
    </div>
</section>
